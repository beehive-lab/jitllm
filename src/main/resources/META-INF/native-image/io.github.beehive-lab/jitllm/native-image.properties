# GraalVM native-image configuration for jitllm, picked up from the jar by any image that has it on
# its class path. The class path entries and module flags for TornadoVM itself depend on the SDK's
# location, so they stay on the native-image command line (see scripts/native-image.sh).
#
# - JitllmNativeImageFeature registers the kernel classes and task-lambda capturing classes that
#   TornadoVM resolves by name at run time.
# - TornadoVM drives CUDA through the FFM API with shared arenas.
# - -H:-VectorAPISupport: the image builder's Vector API support cannot be combined with
#   SharedArenaSupport; the Vector API (CPU path) then runs its portable Java implementation.
# - FloatTensor is initialized at build time with jitllm.VectorBitSize=0, so its VECTOR_BIT_SIZE
#   constant is 0 in the image and the CPU path never creates a VectorSpecies. Otherwise the image
#   build fails in the shared-arena phase on GraalVM 25.0.5. Both settings belong here, not on the
#   command line, so that any build that has the jar on its class path gets them.
Args = --features=org.beehive.jitllm.integration.nativeimage.JitllmNativeImageFeature \
       -H:+UnlockExperimentalVMOptions \
       -H:+ForeignAPISupport \
       -H:+SharedArenaSupport \
       -H:-VectorAPISupport \
       -Djitllm.VectorBitSize=0 \
       --initialize-at-build-time=org.beehive.jitllm.tensor.standard.FloatTensor \
       -H:-UnlockExperimentalVMOptions

name: Setup TornadoVM
description: >
  Prepare the TornadoVM SDK at one exact revision for one backend and JDK, through the same
  scripts/tornadovm-dev.sh that local development uses. Reuses a prepared identity
  (revision + backend + JDK + build recipe) and otherwise builds it under a lock. Exports
  TORNADOVM_HOME, TORNADOVM_REF, TORNADOVM_VERSION, TORNADOVM_RUNTIME_ID and
  MAVEN_REPO_LOCAL for the later steps.

inputs:
  ref:
    description: 'The exact TornadoVM commit (40 hex), resolved once by the calling workflow'
    required: true
  backend:
    description: 'TornadoVM backend to build (opencl, cuda, or metal)'
    required: true
  jdk:
    description: 'Major JDK version the SDK is built for (21 or 25)'
    required: false
    default: '21'
  root:
    description: 'Where prepared SDKs live on this runner (default: the runner tool cache)'
    required: false
    default: ''

outputs:
  sha:
    description: 'The commit actually checked out and built'
    value: ${{ steps.prepared.outputs.sha }}
  artifact_version:
    description: 'The Maven version the build produced (e.g. 6.1.1-jdk21-dev)'
    value: ${{ steps.prepared.outputs.artifact_version }}
  sdk_dir:
    description: 'The SDK directory'
    value: ${{ steps.prepared.outputs.sdk_dir }}
  maven_repo_local:
    description: 'The per-SDK Maven repository holding the matching artifacts'
    value: ${{ steps.prepared.outputs.maven_repo_local }}

# macOS ships bash 3.2; SDKMAN's scripts and this repository's scripts need bash 4+, so
# macOS runners use Homebrew's bash (requires `brew install bash` on the runner).
runs:
  using: composite
  steps:
    - name: Prepare TornadoVM ${{ inputs.ref }} (${{ inputs.backend }}, JDK ${{ inputs.jdk }})
      id: prepared
      shell: ${{ runner.os == 'macOS' && '/opt/homebrew/bin/bash --noprofile --norc -eo pipefail {0}' || 'bash' }}
      run: |
        set -euo pipefail
        if ! [[ "${{ inputs.ref }}" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::ref must be a full 40-hex TornadoVM commit, got '${{ inputs.ref }}'"; exit 1
        fi
        ROOT="${{ inputs.root }}"
        [ -n "$ROOT" ] || ROOT="${RUNNER_TOOL_CACHE}/tornadovm"
        # The per-SDK Maven repository keeps concurrent runs of different revisions from
        # overwriting one another's identical -dev coordinates in ~/.m2.
        scripts/tornadovm-dev.sh setup --ref "${{ inputs.ref }}" --backend "${{ inputs.backend }}" \
          --jdk "${{ inputs.jdk }}" --root "$ROOT" --isolated-repo
        PROV="$ROOT/${{ inputs.backend }}-jdk${{ inputs.jdk }}/current/provenance.json"
        python3 - "$PROV" "${{ inputs.ref }}" >> "$GITHUB_OUTPUT" <<'EOF'
        import json, sys
        p = json.load(open(sys.argv[1]))
        assert p["ref"] == sys.argv[2], f"prepared {p['ref']} but the workflow asked for {sys.argv[2]}"
        for k in ("artifact_version", "sdk_dir", "maven_repo_local"):
            print(f"{k}={p[k]}")
        print(f"sha={p['ref']}")
        EOF

    # Runs whether the SDK was just built or reused. The failure this guards against costs a
    # whole job to discover and reports module names rather than files:
    #   java.lang.LayerInstantiationException: Package org.graalvm.graphio in both module
    #   jdk.internal.vm.compiler and module tornado.graal
    - name: Verify the SDK's Graal jars do not mix packagings
      shell: ${{ runner.os == 'macOS' && '/opt/homebrew/bin/bash --noprofile --norc -eo pipefail {0}' || 'bash' }}
      run: |
        GRAAL_DIR="${{ steps.prepared.outputs.sdk_dir }}/share/java/graalJars"
        if [ ! -d "$GRAAL_DIR" ]; then
          echo "No graalJars directory in the built SDK; this TornadoVM vendors Graal elsewhere."
          exit 0
        fi
        HAS_UPGRADE=0
        HAS_VENDORED=0
        for jar in "$GRAAL_DIR"/*.jar; do
          [ -e "$jar" ] || continue
          name=$("$JAVA_HOME/bin/jar" --describe-module --file="$jar" 2>/dev/null | head -n 1 | awk '{print $1}')
          case "$name" in
            jdk.internal.vm.compiler|jdk.internal.vm.compiler@*) HAS_UPGRADE=1 ;;
            tornado.graal|tornado.graal@*) HAS_VENDORED=1 ;;
          esac
        done
        if [ "$HAS_UPGRADE" = "1" ] && [ "$HAS_VENDORED" = "1" ]; then
          echo "::error::graalJars contains BOTH a jdk.internal.vm.compiler jar and a tornado.graal jar. They both export org.graalvm.graphio, so the boot layer will refuse to start."
          exit 1
        fi
        echo "graalJars verified: a single Graal packaging, no split-package collision."

    - name: Configure TornadoVM environment and record provenance
      shell: ${{ runner.os == 'macOS' && '/opt/homebrew/bin/bash --noprofile --norc -eo pipefail {0}' || 'bash' }}
      run: |
        FULL_SDK="${{ steps.prepared.outputs.sdk_dir }}"
        echo "TORNADOVM_HOME=$FULL_SDK" >> $GITHUB_ENV
        echo "TORNADOVM_REF=${{ steps.prepared.outputs.sha }}" >> $GITHUB_ENV
        echo "TORNADOVM_VERSION=${{ steps.prepared.outputs.artifact_version }}" >> $GITHUB_ENV
        echo "MAVEN_REPO_LOCAL=${{ steps.prepared.outputs.maven_repo_local }}" >> $GITHUB_ENV
        # One label that identifies the runtime: the artifact version alone (6.1.1-jdk21-dev) is
        # the same for every develop commit, so the label carries the commit too.
        SHORT=$(echo "${{ steps.prepared.outputs.sha }}" | cut -c1-12)
        echo "TORNADOVM_RUNTIME_ID=${{ steps.prepared.outputs.artifact_version }}+g$SHORT" >> $GITHUB_ENV
        echo "$FULL_SDK/bin" >> $GITHUB_PATH
        echo "$JAVA_HOME/bin" >> $GITHUB_PATH
        export TORNADOVM_HOME="$FULL_SDK"
        export PATH="$FULL_SDK/bin:$JAVA_HOME/bin:$PATH"
        which tornado || { echo "::error::tornado not in PATH"; exit 1; }
        tornado --devices
        {
          echo "### TornadoVM (${{ inputs.backend }}, JDK ${{ inputs.jdk }})"
          echo "- commit: \`${{ steps.prepared.outputs.sha }}\`"
          echo "- artifacts: \`${{ steps.prepared.outputs.artifact_version }}\`"
          echo "- runtime id: \`${{ steps.prepared.outputs.artifact_version }}+g$SHORT\`"
          echo "- SDK: \`$FULL_SDK\`"
        } >> "$GITHUB_STEP_SUMMARY"

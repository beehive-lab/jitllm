name: Setup Java
description: Install and activate a JDK via SDKMAN. Exports JAVA_HOME and updates PATH.

inputs:
  java_version:
    description: 'SDKMAN Java version identifier (e.g. 21.0.2-open)'
    required: true

runs:
  using: composite
  steps:
    - name: Set up Java with SDKMAN
      # macOS ships bash 3.2 (Apple keeps it frozen for GPLv3 reasons); SDKMAN's own
      # scripts use bash 4+ syntax (${var^^}) and crash under it, so use Homebrew's
      # bash on macOS runners instead. Requires `brew install bash` on the runner.
      shell: ${{ runner.os == 'macOS' && '/opt/homebrew/bin/bash --noprofile --norc -eo pipefail {0}' || 'bash' }}
      run: |
        source "$HOME/.sdkman/bin/sdkman-init.sh"
        if ! sdk list java | grep -q "${{ inputs.java_version }}"; then
          # `sdk install` asks whether to make the new JDK the default. A runner has no one to
          # answer, and under `bash -e` the read failing on end of input ends the step after the
          # JDK is installed. Answer no: the runner's default JDK stays as it is, and the
          # `sdk use` below selects this one for the job.
          echo n | sdk install java "${{ inputs.java_version }}"
        fi
        sdk use java "${{ inputs.java_version }}"
        echo "JAVA_HOME=$HOME/.sdkman/candidates/java/${{ inputs.java_version }}" >> $GITHUB_ENV
        echo "$HOME/.sdkman/candidates/java/${{ inputs.java_version }}/bin" >> $GITHUB_PATH
        java -version

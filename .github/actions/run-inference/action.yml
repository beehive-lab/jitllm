name: Run Inference
description: Run one jitllm inference pass, assert the backend that actually executed, and record the row's outcome against its declared expectation.

inputs:
  backend:
    description: 'GPU backend (opencl, cuda, or metal)'
    required: true
  model_file:
    description: 'Model filename inside $MODELS_DIR (e.g. Llama-3.2-1B-Instruct-F16.gguf)'
    required: true
  model:
    description: 'Human-readable model name for the sidecar (e.g. Llama-3.2-1B-Instruct)'
    required: true
  quantization:
    description: 'Quantization type (e.g. F16, Q8_0)'
    required: true
  configuration:
    description: 'Configuration key for the sidecar (e.g. standard, prefill-decode)'
    required: true
  flags:
    description: 'Extra CLI flags passed to jitllm (omit for standard run)'
    required: false
    default: ''
  timeout_minutes:
    description: 'Per-row wall clock. A row that hangs must not consume the whole job.'
    required: false
    default: '15'
  metrics_file:
    description: 'Absolute path for the output metrics JSON file'
    required: true
  prompt:
    description: 'Prompt to pass to the model'
    required: false
    default: 'What is the capital of France?'
  max_tokens:
    description: >-
      Context budget (-c). Must comfortably exceed the prompt length: when it does not, generation stops
      after ingestion and the row reports zero decode tokens while still exiting 0. 160 is enough
      for every model in the matrix to reach the expected answer, including Qwen3, whose thinking
      mode spends ~135 tokens getting there.
    required: false
    default: '160'
  seed:
    description: 'Fixed so a row is reproducible and two runs can be compared.'
    required: false
    default: '1'
  expect_substring:
    description: >-
      Case-insensitive substring the generated text must contain. This is the row's only check that
      the numbers coming off the accelerator are RIGHT rather than merely present — exit code,
      resolved backend, metrics file and execution_path are all satisfied by a run that emits
      fluent-looking token salad, which is exactly how the Qwen FP16 Metal defect stayed invisible.
      Deliberately a word the prompt itself does not contain, so a match can only come from
      generated output. Set to the empty string to skip the check for a row that has no
      deterministic answer.
    required: false
    default: 'Paris'

runs:
  using: composite
  steps:
    # Every row records its own outcome and does not abort the job. Aborting at the first failure
    # hid the rest of the matrix: a single broken tuple made every later row unknown, so nobody
    # could tell whether one configuration or twenty were affected. The workflow's
    # "Assert standalone inference results" step is what fails the job, after every row has run.
    - name: Run inference
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        JAVA_TOOL_OPTIONS: >-
          -Djitllm.metrics.format=json
          -Djitllm.metrics.output=file
          -Djitllm.metrics.file=${{ inputs.metrics_file }}
        METRICS_FILE: ${{ inputs.metrics_file }}
        ROW_LABEL: '${{ inputs.backend }} | ${{ inputs.model }} | ${{ inputs.quantization }} | ${{ inputs.configuration }}'
      run: |
        RESULTS="${RUNNER_TEMP}/standalone-results.tsv"
        RUN_LOG="$(mktemp)"

        # Backend (opencl/cuda/metal) is auto-detected from $TORNADOVM_HOME/etc/tornado.backend
        # Bounded, and bounded in Python rather than with `timeout`, which stock macOS does
        # not ship. A row that hangs used to consume the entire job: the Metal leg was
        # cancelled at its wall clock every time, so that backend produced no results table
        # at all even though the rows before the hang had passed. 124 is the conventional
        # exit code for a timeout.
        # FP16 is the default key/value cache. Metal has no verified FP16 cache path yet (see
        # docs/architecture/kv-cache-support.md), so jitllm refuses the default there; its rows
        # ask for the FP32 cache explicitly rather than failing on the refusal.
        KV_FLAGS=""
        if [ "${{ inputs.backend }}" = "metal" ]; then KV_FLAGS="--fp32-kv-cache"; fi
        set +e
        python3 - "$RUN_LOG" ${{ inputs.timeout_minutes }} \
          ./jitllm --gpu -v $KV_FLAGS \
          --model $MODELS_DIR/${{ inputs.model_file }} \
          --prompt "${{ inputs.prompt }}" \
          -c ${{ inputs.max_tokens }} \
          --seed ${{ inputs.seed }} \
          ${{ inputs.flags }} <<'RUNNER'
        import os, signal, subprocess, sys, threading
        log, minutes, cmd = sys.argv[1], float(sys.argv[2]), sys.argv[3:]
        # The log is capped. A row that fails inside the device driver emits one line per queued
        # command -- the OpenCL Mistral-7B row wrote hundreds of thousands of
        # CL_MEM_OBJECT_ALLOCATION_FAILURE lines -- and an uncapped log fills the runner's temp
        # disk. The step then died on the first write that followed, before it could record the
        # row, so the job reported a bare exit code and every row after it went unrun. The cause
        # is always in the first megabytes; a flood never is.
        CAP = 32 * 1024 * 1024
        with open(log, "wb") as out:
            # start_new_session, and the kill below goes to the process GROUP. jitllm is a
            # Python wrapper that starts java with subprocess.run, so java is this runner's
            # grandchild. p.kill() reached the wrapper only: the JVM survived its own row, kept
            # holding its unified-memory buffers -- ~9.5 GiB for Phi-3-mini-Q8_0, measured -- and
            # starved every row that followed on a 16 GiB machine. Run 33996905843 ended with
            # "Terminate orphan process: pid (7972) (java)" twice, one per timed-out row, which is
            # the leak this closes.
            p = subprocess.Popen(
                cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, start_new_session=True)

            def pump():
                # Drain the pipe whatever happens: a child whose output nobody reads blocks on a
                # full pipe and never reaches its own exit, which would turn a fast failure into
                # a timeout.
                written = 0
                noted = False
                for chunk in iter(lambda: p.stdout.read(65536), b""):
                    if written < CAP:
                        take = chunk[: CAP - written]
                        out.write(take)
                        written += len(take)
                    elif not noted:
                        out.write(b"\n... further output discarded after 32 MiB ...\n")
                        noted = True
                out.flush()

            reader = threading.Thread(target=pump, daemon=True)
            reader.start()
            try:
                rc = p.wait(timeout=minutes * 60)
                reader.join(timeout=30)
                out.flush()
                sys.exit(rc)
            except subprocess.TimeoutExpired:
                group = os.getpgid(p.pid)
                # SIGTERM first so the JVM can release its device buffers, SIGKILL if it will not.
                for sig, grace in ((signal.SIGTERM, 20), (signal.SIGKILL, 10)):
                    try:
                        os.killpg(group, sig)
                    except ProcessLookupError:
                        break
                    try:
                        p.wait(timeout=grace)
                        break
                    except subprocess.TimeoutExpired:
                        continue
                reader.join(timeout=30)
                out.write(("\nrow timed out after %s minutes\n" % sys.argv[2]).encode())
                out.flush()
                sys.exit(124)
        RUNNER
        RC=$?
        set -e
        # Bounded. A row that fails inside the device driver can emit one line per queued
        # command: the OpenCL Mistral-7B row printed hundreds of thousands of
        # CL_MEM_OBJECT_ALLOCATION_FAILURE lines, and echoing them whole killed this step
        # before it could record the row, so the job died with an unexplained exit code and
        # every row after it went unrun. Head and tail are where the cause is; the middle of
        # a flood never is.
        LOG_LINES=$(wc -l < "$RUN_LOG")
        if [ "$LOG_LINES" -gt 400 ]; then
          head -n 200 "$RUN_LOG"
          echo "... $((LOG_LINES - 400)) lines elided ..."
          tail -n 200 "$RUN_LOG"
        else
          cat "$RUN_LOG"
        fi

        record() {  # status  detail
          printf '%s\t%s\t%s\n' "$ROW_LABEL" "$1" "$2" >> "$RESULTS"
        }

        if [ "$RC" -ne 0 ]; then
          # Record *why* it failed, so the expectations table can require a specific cause rather
          # than tolerating any failure. First interesting line wins; that is the one that names
          # the kernel or the null buffer.
          # `|| true`: with no matching line grep returns 1, `pipefail` propagates it and
          # `bash -e` kills the step before the row is recorded -- so a failure with no
          # recognizable exception line, such as a timeout, produced no row at all.
          SIGNATURE=$(grep -m1 -aE "Exception in thread|Unable to build sketch|TornadoInternalError|OutOfMemory|CL_MEM_OBJECT_ALLOCATION_FAILURE|cuMemAlloc" "$RUN_LOG" \
            | tr -d '\000' | cut -c1-400 || true)
          if [ "$RC" -eq 124 ]; then
            SIGNATURE="timed out after ${{ inputs.timeout_minutes }} minutes"
          fi
          if [ -z "$SIGNATURE" ]; then
            SIGNATURE="exit $RC with no recognizable failure line"
          fi
          echo "::warning::$ROW_LABEL failed: $SIGNATURE"
          record "FAIL" "$SIGNATURE"
          exit 0
        fi

        # A TornadoVM asynchronous error is a device failure that never reaches the exit code:
        # the enqueue fails once per queued command, the JVM still exits 0, and the row would
        # otherwise be judged on whatever text came out of a computation that did not run. That
        # is a failed row, not a wrong-numbers row, and it is recorded as one so the
        # expectations table can name its cause.
        if grep -qa "asynchronous error" "$RUN_LOG"; then
          ASYNC_SIGNATURE=$(grep -m1 -a "asynchronous error" "$RUN_LOG" | tr -d '\000' | cut -c1-400 || true)
          echo "::warning::$ROW_LABEL failed: $ASYNC_SIGNATURE"
          record "FAIL" "$ASYNC_SIGNATURE"
          exit 0
        fi

        # The requested backend is a matrix label, not evidence. Assert what actually executed:
        # jitllm prints the backend it resolved from $TORNADOVM_HOME/etc/tornado.backend (under
        # -v, which the run above passes), and RunMetrics records the execution path the run
        # itself took.
        if ! grep -qE "Detected TornadoVM backend: ${{ inputs.backend }}\b" "$RUN_LOG"; then
          echo "::error::$ROW_LABEL requested backend '${{ inputs.backend }}' but the run did not report resolving it"
          record "WRONG-BACKEND" "requested ${{ inputs.backend }}"
          exit 0
        fi
        if [ ! -s "$METRICS_FILE" ]; then
          echo "::error::$ROW_LABEL produced no metrics file, so the executed path cannot be verified"
          record "NO-METRICS" "$METRICS_FILE absent or empty"
          exit 0
        fi
        # `|| true`: with no matching line grep returns 1, pipefail propagates it, and `bash -e`
        # kills the step *before* the NO-EXEC-PATH branch below can record anything. Run
        # 34125287708 lost all 20 rows on all three backends that way, reporting "No standalone
        # rows were recorded" -- indistinguishable from a matrix-wide failure -- when the actual
        # fault was one absent JSON field. The same guard is already on SIGNATURE above, for the
        # same reason.
        EXEC_PATH=$(grep -o '"execution_path"[[:space:]]*:[[:space:]]*"[^"]*"' "$METRICS_FILE" | head -n 1 | sed 's/.*"\([^"]*\)"$/\1/' || true)
        if [ -z "$EXEC_PATH" ]; then
          echo "::error::$ROW_LABEL reported no execution_path, so no accelerator plan was built — a CPU fallback would look identical to success here"
          record "NO-EXEC-PATH" "metrics lacked execution_path"
          exit 0
        fi
        # Everything above proves the row RAN on the accelerator. None of it proves the numbers
        # are right: the Qwen FP16 Metal defect exited 0, resolved the requested backend, wrote a
        # metrics file and reported a real execution_path while emitting fluent-looking token
        # salad. This is the check that catches that.
        EXPECT='${{ inputs.expect_substring }}'
        if [ -n "$EXPECT" ]; then
          if ! grep -qiF "$EXPECT" "$RUN_LOG"; then
            # `|| true`: head -c closes the pipe as soon as it has its 200 bytes, so grep and
            # tr die of SIGPIPE, `pipefail` takes their status and `bash -e` killed the step
            # right here -- before record ran, so the row vanished and the job reported a bare
            # exit code. Every other pipeline in this file is already guarded for this.
            SNIPPET=$(tr -d '\000' < "$RUN_LOG" | grep -vE "Detected TornadoVM|achieved tok/s|Tokens:|^====|^$|WARNING|^──|^  [^ ].* : |^  Initialization$" | head -c 200 || true)
            echo "::error::$ROW_LABEL ran but its output does not contain '$EXPECT' — the accelerator produced wrong numbers. Got: $SNIPPET"
            record "WRONG-OUTPUT" "expected '$EXPECT'; got: $SNIPPET"
            exit 0
          fi
        fi

        echo "Verified: backend=${{ inputs.backend }} execution_path=$EXEC_PATH output contains '$EXPECT'"
        record "PASS" "execution_path=$EXEC_PATH"

        # Write metadata sidecar so process_metrics.py can identify each metrics file
        SIDECAR="${METRICS_FILE%.json}.meta.json"
        python3 scripts/write_metrics_sidecar.py \
          --out "$SIDECAR" \
          backend="${{ inputs.backend }}" \
          tornadovm_version="${TORNADOVM_RUNTIME_ID:-}" \
          task=llama-inference \
          model_file=${{ inputs.model_file }} \
          model=${{ inputs.model }} \
          quantization=${{ inputs.quantization }} \
          configuration=${{ inputs.configuration }} \
          "flags=${{ inputs.flags }}" \
          prompt="${{ inputs.prompt }}"

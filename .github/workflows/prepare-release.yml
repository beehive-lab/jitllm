name: Prepare jitllm Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.2.3)'
        required: true
        type: string
      tornadovm_release:
        description: 'Published TornadoVM release this jitllm release depends on (e.g. 6.2.0); must be on Maven Central and carry the APIs this code needs'
        required: true
        type: string
      previous_version:
        description: 'Previous version for changelog (e.g., 0.2.2)'
        required: true
        type: string
      dry_run:
        description: 'Dry run - show changes without creating PR'
        required: false
        type: boolean
        default: false

env:
  VERSION: ${{ inputs.version }}
  PREV_VERSION: ${{ inputs.previous_version }}
  JAVA_VERSION: 21.0.2-open
  JAVA_VERSION_25: 25.0.2-open

jobs:
  prepare-release:
    if: github.repository == 'beehive-lab/jitllm'
    runs-on: [self-hosted, Linux, x64]
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 15

    steps:
      - name: Validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format. Expected: X.Y.Z (e.g., 0.2.3)"
            exit 1
          fi
          echo "✅ Version format valid: ${{ inputs.version }}"

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: ./.github/actions/setup-java
        with:
          java_version: ${{ env.JAVA_VERSION }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release branch
        run: |
          git checkout -b release/${{ env.VERSION }}
          echo "✅ Created branch: release/${{ env.VERSION }}"

      # ============================================
      # VERSION UPDATES
      # ============================================

      - name: Update Maven version
        run: |
          # Update <revision> property directly; versions:set would overwrite
          # the CI-friendly ${revision}${jdk.version.suffix} expression.
          sed -i 's|<revision>.*</revision>|<revision>${{ env.VERSION }}</revision>|' pom.xml
          echo "✅ Maven version updated to ${{ env.VERSION }}"

      - name: Select the TornadoVM release this jitllm release depends on
        run: |
          set -euo pipefail
          if [[ ! "${{ inputs.tornadovm_release }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ tornadovm_release must be X.Y.Z (got '${{ inputs.tornadovm_release }}')"; exit 1
          fi
          scripts/set-tornadovm-release.sh "${{ inputs.tornadovm_release }}"
          echo "✅ Releases now depend on TornadoVM ${{ inputs.tornadovm_release }}"

      # Both artifact lines, each with an EMPTY local repository, so only Maven Central can
      # satisfy the release coordinates: a -dev artifact a development build installed on this
      # runner must not stand in for the release. A TornadoVM release that lacks the APIs this
      # code uses fails here at compile time, before any branch or PR exists.
      - name: Verify the release resolves and compiles against that TornadoVM release
        run: |
          # No -u: sdkman-init.sh and the sdk function read unset variables (SDKMAN_CANDIDATES_API, ...).
          set -eo pipefail
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          for JV in "${{ env.JAVA_VERSION }}" "${{ env.JAVA_VERSION_25 }}"; do
            sdk list java | grep -q "$JV" || sdk install java "$JV"
            sdk use java "$JV" > /dev/null
            echo "== $(java -version 2>&1 | head -1)"
            ./mvnw -B -q -P release -Dgpg.skip=true -Dmaven.javadoc.skip=true \
              -Dmaven.repo.local="$(mktemp -d)" clean package -DskipTests
            echo "   jitllm $(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout) against tornado-api $(./mvnw -q -P release help:evaluate -Dexpression=tornadovm.version -DforceStdout)"
          done

      - name: Update README.md
        run: |
          README="README.md"
          START_MARKER="<!-- DEPENDENCY-SNIPPETS:START -->"
          END_MARKER="<!-- DEPENDENCY-SNIPPETS:END -->"
          VERSION="${{ env.VERSION }}"

          if [ ! -f "$README" ]; then
            echo "⚠️  $README not found, skipping"
            exit 0
          fi

          if ! grep -qF "$START_MARKER" "$README" || ! grep -qF "$END_MARKER" "$README"; then
            echo "❌ Could not find $START_MARKER / $END_MARKER markers in $README"
            exit 1
          fi

          SNIPPET_FILE="${{ runner.temp }}/dependency_snippet.md"
          cat > "$SNIPPET_FILE" <<EOF
          **JDK 21** (\`jdk21\` profile, auto-activates for JDK \`[21,25)\`):
          \`\`\`xml
          <dependency>
              <groupId>io.github.beehive-lab</groupId>
              <artifactId>jitllm</artifactId>
              <version>${VERSION}-jdk21</version>
          </dependency>
          \`\`\`

          **JDK 25** (\`jdk25\` profile, auto-activates for JDK \`[25.0.2,)\`):
          \`\`\`xml
          <dependency>
              <groupId>io.github.beehive-lab</groupId>
              <artifactId>jitllm</artifactId>
              <version>${VERSION}-jdk25</version>
          </dependency>
          \`\`\`

          ### 📦 Gradle

          **JDK 21**:
          \`\`\`groovy
          implementation 'io.github.beehive-lab:jitllm:${VERSION}-jdk21'
          \`\`\`

          **JDK 25**:
          \`\`\`groovy
          implementation 'io.github.beehive-lab:jitllm:${VERSION}-jdk25'
          \`\`\`
          EOF

          awk -v start="$START_MARKER" -v end="$END_MARKER" -v snippet_file="$SNIPPET_FILE" '
            $0 == start { print; while ((getline line < snippet_file) > 0) print line; skip=1; next }
            $0 == end   { skip=0 }
            !skip { print }
          ' "$README" > "${{ runner.temp }}/README.new.md"
          mv "${{ runner.temp }}/README.new.md" "$README"

          echo "✅ Updated README.md dependency snippets to ${VERSION}"

      - name: Update CITATION.cff
        run: |
          if [ -f "CITATION.cff" ]; then
            sed -i "s/^version: .*/version: ${{ env.VERSION }}/" CITATION.cff
            RELEASE_DATE=$(date +"%Y-%m-%d")
            sed -i "s/^date-released: .*/date-released: $RELEASE_DATE/" CITATION.cff
            echo "✅ Updated CITATION.cff"
          fi

      # ============================================
      # CHANGELOG GENERATION
      # ============================================

      - name: Fetch merged PRs for changelog
        id: fetch_prs
        uses: actions/github-script@v7
        with:
          script: |
            const prevVersion = '${{ env.PREV_VERSION }}';
            const newVersion = '${{ env.VERSION }}';
            
            let sinceDate;
            try {
              const { data: releases } = await github.rest.repos.listReleases({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 10
              });
            
              const prevRelease = releases.find(r => 
                r.tag_name === `v${prevVersion}` || r.tag_name === prevVersion
              );
              if (prevRelease) {
                sinceDate = prevRelease.published_at;
                console.log(`Found previous release ${prevVersion} from ${sinceDate}`);
              }
            } catch (e) {
              console.log('Could not fetch releases:', e.message);
            }
            
            if (!sinceDate) {
              const date = new Date();
              date.setDate(date.getDate() - 90);
              sinceDate = date.toISOString();
              console.log(`Using fallback date: ${sinceDate}`);
            }
            
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              sort: 'updated',
              direction: 'desc',
              per_page: 100
            });
            
            const mergedPRs = prs.filter(pr => 
              pr.merged_at && new Date(pr.merged_at) > new Date(sinceDate)
            );
            
            console.log(`Found ${mergedPRs.length} merged PRs since ${sinceDate}`);
            
            const features = [];
            const bugfixes = [];
            const models = [];
            const performance = [];
            const other = [];
            
            for (const pr of mergedPRs) {
              const labels = pr.labels.map(l => l.name.toLowerCase());
              const title = pr.title;
              const entry = `- ${title} ([#${pr.number}](${pr.html_url}))`;
            
              if (labels.some(l => l.includes('bug') || l.includes('fix'))) {
                bugfixes.push(entry);
              } else if (labels.some(l => l.includes('model')) || title.toLowerCase().includes('model')) {
                models.push(entry);
              } else if (labels.some(l => l.includes('perf') || l.includes('optim'))) {
                performance.push(entry);
              } else if (labels.some(l => l.includes('feature') || l.includes('enhancement'))) {
                features.push(entry);
              } else {
                other.push(entry);
              }
            }
            
            const today = new Date().toISOString().split('T')[0];
            let changelog = `## [${newVersion}] - ${today}\n\n`;
            
            if (features.length > 0) {
              changelog += '### Features\n\n' + features.join('\n') + '\n\n';
            }
            if (models.length > 0) {
              changelog += '### Model Support\n\n' + models.join('\n') + '\n\n';
            }
            if (performance.length > 0) {
              changelog += '### Performance\n\n' + performance.join('\n') + '\n\n';
            }
            if (bugfixes.length > 0) {
              changelog += '### Bug Fixes\n\n' + bugfixes.join('\n') + '\n\n';
            }
            if (other.length > 0) {
              changelog += '### Other Changes\n\n' + other.join('\n') + '\n\n';
            }
            if (mergedPRs.length === 0) {
              changelog += '<!-- TODO: Add changes manually -->\n\n';
            }
            
            const fs = require('fs');
            fs.writeFileSync('${{ runner.temp }}/changelog_entry.txt', changelog);
            core.setOutput('pr_count', mergedPRs.length);

      - name: Update CHANGELOG.md
        run: |
          CHANGELOG_FILE="CHANGELOG.md"
          CHANGELOG_ENTRY="${{ runner.temp }}/changelog_entry.txt"
          
          if [ ! -f "$CHANGELOG_FILE" ]; then
            echo "# Changelog" > "$CHANGELOG_FILE"
            echo "" >> "$CHANGELOG_FILE"
            echo "All notable changes to jitllm will be documented in this file." >> "$CHANGELOG_FILE"
            echo "" >> "$CHANGELOG_FILE"
          fi
          
          if grep -q "^## \[" "$CHANGELOG_FILE"; then
            FIRST_VERSION_LINE=$(grep -n "^## \[" "$CHANGELOG_FILE" | head -1 | cut -d: -f1)
            {
              head -n $((FIRST_VERSION_LINE - 1)) "$CHANGELOG_FILE"
              cat "$CHANGELOG_ENTRY"
              tail -n +$FIRST_VERSION_LINE "$CHANGELOG_FILE"
            } > "${{ runner.temp }}/changelog_new.md"
            mv "${{ runner.temp }}/changelog_new.md" "$CHANGELOG_FILE"
          else
            cat "$CHANGELOG_ENTRY" >> "$CHANGELOG_FILE"
          fi
          
          echo "✅ Updated CHANGELOG.md"

      - name: Show changes summary
        run: |
          echo "## 📋 Release ${{ env.VERSION }} Preparation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files Modified:" >> $GITHUB_STEP_SUMMARY
          git diff --name-only | while read file; do
            echo "- \`$file\`" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### PRs included: ${{ steps.fetch_prs.outputs.pr_count }}" >> $GITHUB_STEP_SUMMARY

      - name: Commit and push
        if: ${{ inputs.dry_run == false }}
        run: |
          git add -A
          git commit -m "Prepare release ${{ env.VERSION }}"
          git push origin release/${{ env.VERSION }}

      - name: Create Pull Request
        if: ${{ inputs.dry_run == false }}
        uses: actions/github-script@v7
        with:
          script: |
            const version = process.env.VERSION;
            const prCount = '${{ steps.fetch_prs.outputs.pr_count }}';
            
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Release ${version}`,
              head: `release/${version}`,
              base: 'main',
              body: `## 🚀 Release ${version}

            ### 📝 Changes
            - ${prCount} PRs included in changelog
            - Version bumped to ${version}

            ### ✅ Review Checklist
            - [ ] Version number correct in pom.xml
            - [ ] CHANGELOG.md reviewed
            - [ ] CI passes

            ### 🔄 After Merge
            1. **Finalize Release** → tag \`v${version}\` + GitHub release
            2. **Deploy to Maven Central** → publish artifacts
            `
            });
            
            console.log(`✅ Created PR #${pr.number}: ${pr.html_url}`);
            
            const reviewers = ['mikepapadim', 'stratika', 'orionpapadakis'];
            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                reviewers: reviewers
              });
            } catch (e) {
              console.log('Could not request reviewers:', e.message);
            }

      - name: Dry run output
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "🏃 DRY RUN MODE"
          echo ""
          echo "=== Files changed ==="
          git diff --stat
          echo ""
          echo "=== Changelog entry ==="
          cat "${{ runner.temp }}/changelog_entry.txt"
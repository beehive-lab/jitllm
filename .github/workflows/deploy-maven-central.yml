name: Deploy to Maven Central

on:
  workflow_run:
    workflows: ["Finalize jitllm Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (e.g., jitllm-v0.2.3) - leave empty to deploy latest tag'
        required: false
        type: string
      dry_run:
        description: 'Dry run (skip actual deploy)'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      dry_run:
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    name: Deploy to Maven Central (${{ matrix.jdk.name }})
    if: |
      github.repository == 'beehive-lab/jitllm' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, Linux, x64]
    timeout-minutes: 15
    strategy:
      fail-fast: false  # if one JDK fails, still attempt the other
      matrix:
        jdk:
          - name: jdk21
            java_version: 21.0.2-open
          - name: jdk25
            java_version: 25.0.2-open

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Pin to the exact commit finalize-release tagged, rather than whatever
          # main HEAD happens to be when this job starts (it can drift if another
          # PR merges in the gap between finalize-release finishing and this job
          # picking up the workflow_run event).
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.tag || '' }}

      - name: Set up Java
        uses: ./.github/actions/setup-java
        with:
          java_version: ${{ matrix.jdk.java_version }}

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${env.MAVEN_USERNAME}</username>
                <password>${env.MAVEN_PASSWORD}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>gpg</id>
                <properties>
                  <gpg.executable>gpg</gpg.executable>
                  <gpg.keyname>${env.GPG_KEYNAME}</gpg.keyname>
                  <gpg.passphrase>${env.GPG_PASSPHRASE}</gpg.passphrase>
                </properties>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>gpg</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
        env:
          GPG_TTY: $(tty)

      # The release profile refuses development coordinates, and an empty local repository
      # makes Maven Central the only source of the TornadoVM release the POM names.
      - name: Verify the TornadoVM release dependency resolves from Maven Central
        run: |
          ./mvnw -B -q -P release -Dgpg.skip=true -Dmaven.javadoc.skip=true \
            -Dmaven.repo.local="$(mktemp -d)" dependency:resolve
          echo "tornado-api $(./mvnw -q -P release help:evaluate -Dexpression=tornadovm.version -DforceStdout) resolved from Maven Central"

      - name: Deploy to Maven Central
        if: ${{ !inputs.dry_run }}
        run: |
          ./mvnw clean deploy \
            -P release \
            -DskipTests \
            --batch-mode
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          GPG_KEYNAME: ${{ secrets.GPG_KEYNAME }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Dry Run - Verify build only
        if: ${{ inputs.dry_run }}
        run: |
          ./mvnw clean verify \
            -P release \
            -DskipTests \
            --batch-mode
        env:
          GPG_KEYNAME: ${{ secrets.GPG_KEYNAME }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Deployment Summary
        if: ${{ !inputs.dry_run }}
        run: |
          DEPLOYED_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout 2>/dev/null)
          echo "## 🚀 Maven Central Deployment (${{ matrix.jdk.name }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| JDK | ${{ matrix.jdk.name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${DEPLOYED_VERSION} |" >> $GITHUB_STEP_SUMMARY
          echo "| GroupId | io.github.beehive-lab |" >> $GITHUB_STEP_SUMMARY
          echo "| ArtifactId | jitllm |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📍 [View on Maven Central](https://central.sonatype.com/artifact/io.github.beehive-lab/jitllm/${DEPLOYED_VERSION})" >> $GITHUB_STEP_SUMMARY